[package]
name = "brain-tools"
version = "0.1.0"
edition = "2021"
authors = ["Brain Tools Contributors"]
description = "High-performance local MCP server for surgical code search, context graph and impact analysis"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]

[dependencies]
# Tokio async ecosystem
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
dashmap = "6.1"
crossbeam-channel = "0.5"

# Tracing & Logging (strictly to stderr)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization & JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Ripgrep Lexical Search Engine
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# Tree-sitter & Language Grammars
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-kotlin = "0.3"
streaming-iterator = "0.1"

# Graph Engine & Incremental Invalidation
petgraph = { version = "0.6", features = ["serde-1"] }
blake3 = "1.5"
notify = "6.1"

# Local LLM Inference Engine (GGUF)
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }
