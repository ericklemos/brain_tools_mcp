[workspace]
resolver = "2"
members = [
    "crates/brain-kernel",
    "crates/brain-search",
    "crates/brain-graph",
    "crates/brain-exec",
    "crates/brain-web",
    "crates/brain-tools",
    "crates/brain-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Brain Tools Contributors"]

[workspace.dependencies]
# Tokio async ecosystem
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
crossbeam-channel = "0.5"

# Tracing & Logging (strictly to stderr)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization & JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Ripgrep Lexical Search Engine
regex = "1.10"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# Tree-sitter & Language Grammars
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-kotlin-ng = "1.1.0"
streaming-iterator = "0.1"

# Graph Engine & Incremental Invalidation
petgraph = { version = "0.6", features = ["serde-1"] }
blake3 = "1.5"
notify = "6.1"

# Web fetch: the network is a source, not a destination.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
scraper = "0.29"
dom_smoothie = "0.19"

# Dev
tempfile = "3.10"

[profile.release]
# Runtime máximo: um único CGU e LTO completo entre crates deixam o LLVM
# inlinar através das fronteiras de brain-kernel/search/graph/exec/web/tools
# e das dependências (regex, tree-sitter, serde_json, tokio). Custo: o build
# de release fica bem mais lento que com LTO thin.
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false
# Mantém unwind para que um panic em uma tool não derrube o daemon MCP.
# Trocar por "abort" rende mais alguns por cento e um binário menor.
panic = "unwind"
