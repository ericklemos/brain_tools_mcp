name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: brain-tools
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: brain-tools.exe

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p brain-tools --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-tools-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Token regression guard: replays bench/tasks.json against the binary that
  # was just built and fails when a task (or the tools/list schema) grows more
  # than 10% over the committed baseline. See docs/bench.md.
  bench:
    name: bench (tokens)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # brain_why reads `git log -L`; a shallow clone would change its cost.
          fetch-depth: 0

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: brain-tools-x86_64-unknown-linux-gnu
          path: bin

      - name: Make binary executable
        run: chmod +x bin/brain-tools

      - name: Harness unit tests
        run: cargo test --locked -p brain-bench

      - name: Measure token cost against the baseline
        run: cargo run --locked -p brain-bench -- --server bin/brain-tools
