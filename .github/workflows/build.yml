name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.isa }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # One artifact per target *and* ISA baseline. The generic build is the
      # fallback that must run anywhere; the x86-64-v* builds are opt-in and
      # declare their minimum CPU in the artifact name, so nobody downloads
      # AVX2 code onto a pre-2013 machine by accident.
      matrix:
        include:
          # Linux: the full ladder, including AVX-512.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: generic
            config: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v2
            config: '--config target.x86_64-unknown-linux-gnu.rustflags=["-Ctarget-cpu=x86-64-v2"]'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v3
            config: '--config target.x86_64-unknown-linux-gnu.rustflags=["-Ctarget-cpu=x86-64-v3"]'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v4
            config: '--config target.x86_64-unknown-linux-gnu.rustflags=["-Ctarget-cpu=x86-64-v4"]'
          # macOS and Windows: generic plus the AVX2 baseline. v4 is skipped on
          # hosted runners because their CPUs are not guaranteed to have AVX-512.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: brain-tools
            isa: generic
            config: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: brain-tools
            isa: x86-64-v3
            config: '--config target.x86_64-apple-darwin.rustflags=["-Ctarget-cpu=x86-64-v3"]'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: brain-tools.exe
            isa: generic
            config: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: brain-tools.exe
            isa: x86-64-v3
            config: '--config target.x86_64-pc-windows-msvc.rustflags=["-Ctarget-cpu=x86-64-v3"]'

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # `--config target.<triple>.rustflags` applies the CPU baseline to the
      # target artifacts only, never to the build scripts and proc macros the
      # runner itself has to execute.
      - name: Build release binary
        run: cargo build --release --locked -p brain-tools --target ${{ matrix.target }} ${{ matrix.config }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-tools-${{ matrix.target }}-${{ matrix.isa }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Token regression guard: replays bench/tasks.json against the binary that
  # was just built and fails when a task (or the tools/list schema) grows more
  # than 10% over the committed baseline. See docs/bench.md.
  bench:
    name: bench (tokens)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # brain_why reads `git log -L`; a shallow clone would change its cost.
          fetch-depth: 0

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: brain-tools-x86_64-unknown-linux-gnu-generic
          path: bin

      - name: Make binary executable
        run: chmod +x bin/brain-tools

      - name: Harness unit tests
        run: cargo test --locked -p brain-bench

      - name: Measure token cost against the baseline
        run: cargo run --locked -p brain-bench -- --server bin/brain-tools
