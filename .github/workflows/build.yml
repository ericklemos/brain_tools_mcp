name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.isa }})
    runs-on: ${{ matrix.os }}
    # LTO "fat" + codegen-units = 1 custam tempo de link em troca de runtime;
    # a folga cobre runners frios com o cache vazio.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One artifact per target *and* ISA baseline. The generic build is the
      # fallback that must run anywhere; the x86-64-v* builds are opt-in and
      # declare their minimum CPU in the artifact name, so nobody downloads
      # AVX2 code onto a pre-2013 machine by accident.
      matrix:
        include:
          # Linux: the full ladder, including AVX-512.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: generic
            rustflags: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v2
            rustflags: '-Ctarget-cpu=x86-64-v2'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v3
            rustflags: '-Ctarget-cpu=x86-64-v3'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: brain-tools
            isa: x86-64-v4
            rustflags: '-Ctarget-cpu=x86-64-v4'
          # macOS and Windows: generic plus the AVX2 baseline. v4 is skipped on
          # hosted runners because their CPUs are not guaranteed to have AVX-512.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: brain-tools
            isa: generic
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: brain-tools
            isa: x86-64-v3
            rustflags: '-Ctarget-cpu=x86-64-v3'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: brain-tools.exe
            isa: generic
            rustflags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: brain-tools.exe
            isa: x86-64-v3
            rustflags: '-Ctarget-cpu=x86-64-v3'

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # `CARGO_TARGET_<TRIPLE>_RUSTFLAGS` applies the CPU baseline to the
      # target artifacts only, never to the build scripts and proc macros the
      # runner itself has to execute. It is used instead of
      # `--config target.<triple>.rustflags=[...]` because the step's shell
      # (bash and pwsh alike) strips the quotes of the TOML array when the
      # matrix value is interpolated into the script, leaving
      # `=[-Ctarget-cpu=...]` and failing to parse it as TOML.
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS_ISA: ${{ matrix.rustflags }}
        run: |
          if [ -n "$RUSTFLAGS_ISA" ]; then
            triple_upper=$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')
            export "CARGO_TARGET_${triple_upper}_RUSTFLAGS=$RUSTFLAGS_ISA"
          fi
          cargo build --release --locked -p brain-tools --target "$TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-tools-${{ matrix.target }}-${{ matrix.isa }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Token regression guard: replays bench/tasks.json against the binary that
  # was just built and fails when a task (or the tools/list schema) grows more
  # than 10% over the committed baseline. See docs/bench.md.
  bench:
    name: bench (tokens)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # brain_why reads `git log -L`; a shallow clone would change its cost.
          fetch-depth: 0

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: brain-tools-x86_64-unknown-linux-gnu-generic
          path: bin

      - name: Make binary executable
        run: chmod +x bin/brain-tools

      - name: Harness unit tests
        run: cargo test --locked -p brain-bench

      - name: Measure token cost against the baseline
        run: cargo run --locked -p brain-bench -- --server bin/brain-tools
